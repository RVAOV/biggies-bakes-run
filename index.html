<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:Raleway,system-ui,sans-serif;
    background:radial-gradient(1200px 700px at 50% -10%, #3b3573, #2f2951 60%, #262043);
    color:#f8f0e4; display:grid; place-items:center; padding:24px;
  }
  .gate{
    width:min(420px,100%); text-align:center;
    background:linear-gradient(180deg,#fff,#f8f0e4);
    border-radius:26px; padding:30px 28px 26px;
    box-shadow:0 26px 60px rgba(14,10,36,.5), inset 0 0 0 2px rgba(255,255,255,.9);
  }
  .gate__logo{
    height:46px; width:auto; background:#2f2951;
    border-radius:999px; padding:9px 19px; margin-bottom:14px;
  }
  h1{
    font-family:Fredoka,Raleway,sans-serif; font-weight:600;
    font-size:30px; line-height:1.05; margin:0 0 6px; color:#343579; letter-spacing:-.01em;
  }
  p.sub{ margin:0 0 20px; font-size:14.5px; line-height:1.5; color:#584f5e; }
  label{
    display:block; text-align:left; font-family:Fredoka,sans-serif; font-weight:600;
    font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
    color:#8b8397; margin:0 0 6px 2px;
  }
  input{
    width:100%; font:600 17px Raleway,sans-serif; color:#2b2942;
    padding:13px 15px; border-radius:14px; border:2px solid rgba(52,53,121,.18);
    background:#fff; outline:none; letter-spacing:.06em;
  }
  input:focus{ border-color:#93da49; box-shadow:0 0 0 4px rgba(147,218,73,.22); }
  button{
    width:100%; margin-top:14px; cursor:pointer; border:0;
    font-family:Fredoka,sans-serif; font-weight:600; font-size:19px; color:#243318;
    padding:14px; border-radius:999px;
    background:linear-gradient(180deg,#a7e65c,#8ccd3f);
    box-shadow:0 5px 0 #6fa531, 0 12px 24px rgba(111,165,49,.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button:hover{ transform:translateY(-2px); box-shadow:0 7px 0 #6fa531, 0 16px 28px rgba(111,165,49,.4); }
  button:active{ transform:translateY(3px); box-shadow:0 2px 0 #6fa531; }
  button[disabled]{ opacity:.6; cursor:progress; transform:none; }
  .msg{ min-height:19px; margin:12px 0 0; font-size:13.5px; font-weight:600; color:#d94f3d; }
  .msg--busy{ color:#6d6577; }
  .foot{ margin:16px 0 0; font-size:11.5px; color:#9c95a5; }
  .foot a{ color:#6d6577; }
  @media (max-height:520px){
    .gate{ padding:18px 20px; } .gate__logo{ height:34px; margin-bottom:9px; }
    h1{ font-size:23px; } p.sub{ font-size:13px; margin-bottom:13px; }
  }
</style>
</head>

const $ = (id) => document.getElementById(id);
const msg = $('msg');
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function gunzip(buf) {
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([buf]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function decrypt(password) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: unb64(VAULT.s), iterations: VAULT.n, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  // a wrong password fails the GCM auth tag here and throws — no comparison
  // to patch out, and nothing is rendered
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(VAULT.i) }, key, unb64(VAULT.d));
  return JSON.parse(new TextDecoder().decode(await gunzip(new Uint8Array(plain))));
}

function boot(B) {
  // swap every asset path for its inlined data URI
  const sub = (text) => Object.entries(B.assets)
    .reduce((acc, [path, uri]) => acc.split(path).join(uri), text);

  document.head.insertAdjacentHTML('beforeend', '<style>' + sub(B.css) + '</style>');
  document.body.innerHTML = sub(B.body);
  document.body.style.cssText = '';

  // Modules are created leaf-first so each import can be rewritten to the
  // blob URL of a module that already exists — relative specifiers cannot
  // resolve from inside a blob.
  const urls = {};
  for (const name of B.order) {
    const src = B.modules[name].replace(
      /from\s*(['"])\.\/([\w.-]+?)\.js(\?v=[0-9a-f]+)?\1/g,
      (m, q, base) => 'from ' + q + urls[base + '.js'] + q);
    urls[name] = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  }
  return import(urls['game.js']);
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = $('pw').value.trim();
  if (!pw) return;
  if (!window.isSecureContext || !crypto.subtle) {
    msg.textContent = 'This page needs a secure (https) connection.'; return;
  }
  if (typeof DecompressionStream === 'undefined') {
    msg.textContent = 'Please use an up-to-date browser.'; return;
  }
  $('go').disabled = true;
  msg.className = 'msg msg--busy';
  msg.textContent = 'Unlocking…';
  try {
    // let the browser paint the busy state before PBKDF2 blocks
    await new Promise((r) => setTimeout(r, 30));
    const B = await decrypt(pw);
    await boot(B);
  } catch (err) {
    msg.className = 'msg';
    msg.textContent = "That's not it. Have another go.";
    $('go').disabled = false;
    $('pw').select();
  }
});

$('pw').focus();
</script>
